name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .

      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile core
        run: python -m compileall -q src
      - name: Check entry point
        run: adaptive-qa --status
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  release:
    name: Inactive release packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install locked verification dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Build committed inactive release
        run: python scripts/build_release.py
      - name: Verify digests and installed wheel away from checkout
        run: python scripts/check_release.py artifacts/releases/${{ github.sha }}
      - name: Verify non-executing rollback compatibility planning
        run: python scripts/check_rollback_plan.py artifacts/releases/${{ github.sha }}
      - name: Upload inactive release bundle
        uses: actions/upload-artifact@v7
        with:
          name: inactive-release-${{ github.sha }}
          path: artifacts/releases/${{ github.sha }}/
          retention-days: 7
          if-no-files-found: error

      - name: Upload safe rollback planning evidence
        uses: actions/upload-artifact@v7
        with:
          name: inactive-rollback-plan-${{ github.sha }}
          path: artifacts/deployment/rollback-plan.json
          retention-days: 7
          if-no-files-found: error

  processes:
    name: Process lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Verify real process trees and worker locks
        run: python scripts/check_process_lifecycle.py
      - name: Verify cancellable discovery supervision
        run: python -m unittest discover -s tests -p test_discovery_process.py -v
      - name: Verify offline deployment backup and bundle checks
        run: |
          python -m unittest discover -s tests -p "test_backup*.py" -v
          python -m unittest discover -s tests -p test_schema_migrations.py -v
          python -m unittest discover -s tests -p test_runtime_schema.py -v
          python -m unittest discover -s tests -p test_storage_health.py -v
          python -m unittest discover -s tests -p test_local_runtime.py -v
          python -m unittest discover -s tests -p test_agent_registry.py -v
          python -m unittest discover -s tests -p test_agent_broker.py -v
          python -m unittest discover -s tests -p test_agent_transport.py -v
          python -m unittest discover -s tests -p test_agent_client.py -v
          python -m unittest discover -s tests -p test_agent_worker.py -v
          python -m unittest discover -s tests -p test_maintenance.py -v
      - name: Upload lifecycle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: process-lifecycle-${{ matrix.os }}
          path: artifacts/processes/report.json
          retention-days: 7
          if-no-files-found: error

  database:
    name: Controlled database checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Verify isolated database scenarios
        run: python scripts/check_local_database.py
      - name: Verify database policy and process boundaries
        run: |
          python -m unittest discover -s tests -p "test_database*.py" -v
          python scripts/check_database_boundaries.py
      - name: Upload safe database evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-database-evidence-${{ matrix.os }}
          path: artifacts/database/*.json
          retention-days: 7
          if-no-files-found: error

  api:
    name: Controlled API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Verify controlled API scenarios
        run: python scripts/check_local_api.py
      - name: Verify API policies redaction and total deadlines
        run: python scripts/check_api_boundaries.py
      - name: Upload API evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-api-evidence
          path: artifacts/api/
          retention-days: 7
          if-no-files-found: error

  browser:
    name: Local browser check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Verify built React dashboard
        run: python scripts/check_dashboard_ui.py
      - name: Verify organization roles and shared configuration UI
        run: python scripts/check_organization_ui.py
      - name: Verify two-organization admission isolation and real workers
        run: python scripts/check_organization_isolation.py
      - name: Verify signed outbound agent against controlled local fixtures
        run: python scripts/check_outbound_agent.py
      - name: Build static interface demo
        working-directory: frontend
        run: npm run build:demo
      - name: Verify static demo without API or external requests
        run: python scripts/check_pages_demo.py
      - name: Verify browser egress and redirect protection
        run: python scripts/check_network_security.py
      - name: Verify dashboard browser authentication
        run: python scripts/check_web_auth.py
      - name: Verify separate owned discovery worker
        run: python scripts/check_dashboard_worker.py
      - name: Verify separate owned UI test worker
        run: python scripts/check_dashboard_runs.py
      - name: Upload browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-browser-evidence
          path: |
            artifacts/results/*.json
            artifacts/screenshots/*.png
            artifacts/security/*.json
            artifacts/smoke/*.json
            artifacts/discovery/*.json
            artifacts/matching/*.json
            artifacts/bridge/*.json
            artifacts/database/bridge.json
            artifacts/ai/*.json
            artifacts/dashboard/*.json
            artifacts/dashboard/*.png
            artifacts/organizations/*.json
            artifacts/organizations/*.png
            artifacts/demo/*.json
            artifacts/demo/*.png
          retention-days: 7
          if-no-files-found: warn

  local_runtime:
    name: Packaged local runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install locked dependencies and current supervisor
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Install controlled browser runtime
        run: python -m playwright install --with-deps chromium
      - name: Build reviewed historical release
        run: python scripts/build_release.py --commit a71bc2c69140b3d4bd993be7495ab2d360f8decc
      - name: Build current committed release
        run: python scripts/build_release.py
      - name: Verify installed current package
        run: python scripts/check_release.py artifacts/releases/${{ github.sha }}
      - name: Verify managed execution recovery and binary rollback
        run: python scripts/check_local_runtime.py artifacts/releases/${{ github.sha }}
      - name: Upload value-free runtime and rollback evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-runtime-${{ matrix.os }}
          path: artifacts/deployment/local-runtime.json
          retention-days: 7
          if-no-files-found: error

  ui_catalog:
    name: UI catalog and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Verify structural page collection
        run: python scripts/check_page_collector.py
      - name: Verify deterministic element matching
        run: python scripts/check_element_matching.py
      - name: Verify cross-site document rules and negative fixtures
        run: python scripts/check_document_catalog.py
      - name: Verify independent document execution on contrasting local targets
        run: python scripts/check_document_execution.py
      - name: Verify reusable UI checks across fixture names
        run: python scripts/check_reusable_ui.py
      - name: Verify fixture cleanup and reverse-order independence
        run: python scripts/check_ui_isolation.py
      - name: Upload catalog and isolation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-catalog-evidence
          path: |
            artifacts/results/*.json
            artifacts/screenshots/*.png
            artifacts/matching/*.json
          retention-days: 7
          if-no-files-found: warn

  browser_integrations:
    name: Browser integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Verify UI API database record creation and readback
        run: python scripts/check_database_bridge.py
      - name: Verify free local AI integration and fallback boundaries
        run: python scripts/check_ai_acceptance.py
      - name: Verify explicit UI and API validation binding
        run: python scripts/check_ui_api_bridge.py
      - name: Verify bounded local discovery
        run: python scripts/check_local_discovery.py
      - name: Verify contrasting discovery fixtures and test plans
        run: python scripts/check_discovery_acceptance.py
      - name: Run controlled local browser check
        run: python scripts/check_local_browser.py
      - name: Upload browser integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-integration-evidence
          path: |
            artifacts/results/*.json
            artifacts/screenshots/*.png
            artifacts/smoke/*.json
            artifacts/discovery/*.json
            artifacts/bridge/*.json
            artifacts/database/bridge.json
            artifacts/ai/*.json
          retention-days: 7
          if-no-files-found: warn
