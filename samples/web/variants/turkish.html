<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Adaptive QA Sample</title>
    </head>
    <body>
        <header>
            <h1>Adaptive QA Sample</h1>
            <nav data-testid="navigation" aria-label="Main navigation">
                <a data-testid="nav-login" href="#login">Giriş yap</a>
                <a data-testid="nav-search" href="#search">Ara</a>
            </nav>
        </header>

        <main>
            <section id="login" aria-labelledby="login-heading">
                <h2 id="login-heading">Giriş yap</h2>

                <form id="login-form" data-testid="login-form">
                    <div>
                        <label for="username">Kullanıcı adı</label>
                        <input
                            id="username" data-testid="mapped-login-username" pattern="[a-z][a-z0-9_\-]{2,31}"
                            name="username"
                            type="text"
                            autocomplete="username"
                            required
                        />
                    </div>

                    <div>
                        <label for="password">Şifre</label>
                        <input
                            id="password" data-testid="mapped-login-password" minlength="8"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        />
                    </div>

                    <button data-testid="mapped-login-submit" type="submit">Giriş yap</button>
<button type="button" data-testid="login-toggle" id="login-toggle">Toggle password visibility</button>
<button type="reset" data-testid="login-reset">Reset login</button>
                    <p id="login-result" role="status"></p>
                </form>
            </section>

            <section id="search" aria-labelledby="search-heading">
                <h2 id="search-heading">Ara</h2>

                <form id="search-form" data-testid="search-form" role="search">
                    <label for="query">Ürün ara</label>
                    <input id="query" data-testid="mapped-search-query" maxlength="64" name="query" type="search" required />
                    <button data-testid="mapped-search-submit" type="submit">Ara</button>
<button type="reset" data-testid="search-reset">Reset search</button>
                    <p id="search-result" role="status"></p>
                </form>
            </section>
<section><h2>Native controls</h2><form id="controls-form" data-testid="controls-form">
<label>Email <input type="email" data-testid="control-email" required></label>
<label><input type="checkbox" data-testid="control-terms" required>Accept terms</label>
<label><input type="radio" name="delivery" data-testid="control-standard" checked>Standard</label>
<label><input type="radio" name="delivery" data-testid="control-express">Express</label>
<label>Country <select data-testid="control-country"><option value="gb">United Kingdom</option><option value="tr">Türkiye</option></select></label>
<label>Notes <textarea data-testid="control-notes"></textarea></label>
<label>Quantity <input type="number" min="1" max="10" step="1" value="1" data-testid="control-quantity"></label>
<label>Disabled <input value="fixed-disabled" disabled data-testid="control-disabled"></label>
<label>Read only <input value="fixed-readonly" readonly data-testid="control-readonly"></label>
<button type="submit" data-testid="control-submit">Submit controls</button>
<button type="reset" data-testid="control-reset">Reset controls</button>
<p id="controls-result" role="status"></p></form></section>
        </main>

        <script>
            document
                .getElementById("login-form")
                .addEventListener("submit", (event) => {
                    event.preventDefault();
                    document.getElementById("login-result").textContent =
                        "Demo only: authentication is not connected.";
                });

            document
                .getElementById("search-form")
                .addEventListener("submit", (event) => {
                    event.preventDefault();
                    const query = document.getElementById("query").value.trim();

                    document.getElementById("search-result").textContent = query
                        ? `No products found for "${query}".`
                        : "Enter a search term.";
                });
document.getElementById('login-toggle').addEventListener('click', () => {
const input = document.getElementById('password'); input.type = input.type === 'password' ? 'text' : 'password';
});
for (const name of ['login', 'search', 'controls']) {
document.getElementById(name + '-form').addEventListener('reset', () => {
document.getElementById(name + '-result').textContent = '';
if (name === 'login') document.getElementById('password').type = 'password';
});
}
document.getElementById('controls-form').addEventListener('submit', event => {
event.preventDefault(); document.getElementById('controls-result').textContent = 'Demo controls submitted.';
});
        </script>
    </body>
</html>
