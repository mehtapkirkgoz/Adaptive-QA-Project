[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-qa"
version = "0.1.0.dev0"
description = "Adaptive web quality assurance platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography==50.0.2",
    "playwright==1.64.0",
    "fastapi==0.158.1",
    "uvicorn==0.54.0",
]

[project.scripts]
adaptive-qa = "adaptive_qa.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
